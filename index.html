<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI AVTO & CodeUstoz</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Asosiy Ekran Qavatlari */
    .app-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100vh - 60px);
      display: none;
      overflow: hidden;
    }
    .app-screen.is-active {
      display: block !important;
    }

    /* Pastki Tab Bar */
    #bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 60px;
      background: #090d16;
      border-top: 1px solid #1e293b;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 99999;
    }
    .nav-btn {
      background: none;
      border: none;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-btn.active {
      color: #22c55e;
    }
    .nav-btn i {
      font-size: 20px;
    }

    /* ======================================================== */
    /* 1-EKRAN: PRAVATEST EDU 3D AVTODROM                       */
    /* ======================================================== */
    #screen-avtodrom {
      position: relative;
      background: #87CEEB;
    }
    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* HUD elementlari */
    .prava-hud-btn {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .prava-hud-btn:active {
      transform: scale(0.92);
    }

    /* Rul (Steering Wheel) */
    #wheel-dial {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #1e293b 40%, #090d16 80%, #15803d 95%);
      border: 5px solid #334155;
      box-shadow: 0 6px 20px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      transition: transform 0.05s linear;
      cursor: grab;
    }
    #wheel-dial::before {
      content: '';
      position: absolute;
      top: 2px;
      width: 14px;
      height: 7px;
      background: #22c55e;
      border-radius: 2px;
    }

    /* Spidometr */
    .speed-dial {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: radial-gradient(circle, #020617 50%, #1e293b 100%);
      border: 2px solid #475569;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Pedallar & Uzatma */
    .gear-box {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 3px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 38px;
    }
    .gear-item {
      padding: 5px 0;
      border-radius: 8px;
      color: #94a3b8;
      font-weight: 900;
      font-size: 13px;
      text-align: center;
      cursor: pointer;
    }
    .gear-item.active {
      background: #16a34a;
      color: #fff;
    }
    .pedal-box {
      width: 48px;
      border-radius: 10px;
      background: linear-gradient(180deg, #334155 0%, #0f172a 100%);
      border: 2px solid #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 6px 0;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .pedal-box:active, .pedal-box.is-down {
      background: linear-gradient(180deg, #15803d 0%, #052e16 100%);
      border-color: #22c55e;
      transform: translateY(3px);
    }
    .pedal-line { width: 65%; height: 3px; background: #94a3b8; border-radius: 2px; }

    /* ======================================================== */
    /* 2-EKRAN: CODEUSTOZ (VS CODE & JONLI NATIJA)              */
    /* ======================================================== */
    #screen-codeustoz {
      display: none;
      flex-direction: column;
      background: #1e1e1e;
    }
    /* Yuqori Tab / Live Preview (Oq Brauzer) */
    .vsc-top-preview {
      height: 38%;
      background: #ffffff;
      color: #000000;
      border-bottom: 2px solid #333333;
      display: flex;
      flex-direction: column;
      padding: 12px;
      overflow: auto;
    }
    .vsc-preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    .vsc-url-bar {
      background: #f1f5f9;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      color: #64748b;
      font-family: monospace;
    }
    #vsc-render-box {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    /* Pastki Qism: VS Code Tahrirlagich */
    .vsc-bottom-editor {
      height: 62%;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      font-family: "Consolas", "Courier New", monospace;
    }
    .vsc-file-tab {
      background: #252526;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      font-size: 12px;
      color: #fff;
      border-top: 2px solid #007acc;
      width: fit-content;
    }
    .vsc-text-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .vsc-numbers {
      width: 32px;
      color: #858585;
      text-align: right;
      padding: 8px 8px 8px 0;
      font-size: 12px;
      line-height: 20px;
      user-select: none;
      border-right: 1px solid #2d2d2d;
    }
    #code-text-area {
      flex: 1;
      background: #1e1e1e;
      color: #9cdcfe;
      border: none;
      outline: none;
      padding: 8px 10px;
      font-family: "Consolas", monospace;
      font-size: 12px;
      line-height: 20px;
      resize: none;
      white-space: pre;
      overflow: auto;
    }
    .vsc-status {
      height: 22px;
      background: #007acc;
      color: #ffffff;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <!-- ======================================================== -->
  <!-- 1. AVTODROM 3D EKRANI (PRAVATEST EDU)                     -->
  <!-- ======================================================== -->
  <section id="screen-avtodrom" class="app-screen is-active">
    <canvas id="three-canvas"></canvas>

    <!-- Yuqori Chap HUD -->
    <div style="position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 6px; z-index: 10;">
      <button class="prava-hud-btn" style="width: 34px; height: 34px;" onclick="switchScreen('codeustoz')">
        <i class="fa-solid fa-bars text-xs"></i>
      </button>
      <button class="prava-hud-btn" style="width: 34px; height: 34px;" onclick="resetCobaltPos()">
        <i class="fa-solid fa-house text-xs"></i>
      </button>
      <div style="background: #2563eb; color: #fff; padding: 5px 10px; border-radius: 10px; font-weight: 800; font-size: 11px; display: flex; align-items: center; gap: 4px;">
        <i class="fa-solid fa-clipboard-check text-xs"></i>
        <span>Imtihon</span>
      </div>
    </div>

    <!-- Cobalt Rangi va Raqami -->
    <div style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; z-index: 10;">
      <div class="prava-hud-btn" style="padding: 2px 6px; gap: 5px;">
        <button onclick="setCobaltColor3D(0xffffff)" id="btnColWhite" style="width: 18px; height: 18px; border-radius: 4px; background: #fff; border: 2px solid #22c55e; cursor: pointer;"></button>
        <button onclick="setCobaltColor3D(0x111827)" id="btnColBlack" style="width: 18px; height: 18px; border-radius: 4px; background: #000; border: 1px solid #64748b; cursor: pointer;"></button>
      </div>
      <div style="background: #fff; color: #000; border: 1.5px solid #000; font-family: Impact; font-size: 10px; letter-spacing: 1px; padding: 1px 5px; border-radius: 3px;">
        <span style="color: blue; font-weight: 900;">01</span> AIAVTOROBOT
      </div>
    </div>

    <!-- Yuqori O'ng HUD (Minimap & Tugmalar) -->
    <div style="position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 10;">
      <div style="width: 90px; height: 55px; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; position: relative; overflow: hidden;">
        <div style="position: absolute; top: 25px; left: 0; width: 100%; height: 8px; background: #334155;"></div>
        <div style="position: absolute; left: 42px; top: 0; width: 8px; height: 100%; background: #334155;"></div>
        <div id="miniBlip" style="position: absolute; top: 26px; left: 43px; width: 6px; height: 6px; background: #38bdf8; border-radius: 50%;"></div>
      </div>
      <div style="display: flex; gap: 4px;">
        <button class="prava-hud-btn" style="width: 30px; height: 30px;" onclick="toggleCam()"><i class="fa-solid fa-camera text-[10px]"></i></button>
        <button class="prava-hud-btn" style="width: 30px; height: 30px; color: #f43f5e;" onclick="stopCarInstantly()"><i class="fa-solid fa-triangle-exclamation text-[10px]"></i></button>
        <button class="prava-hud-btn" style="width: 30px; height: 30px;" onclick="resetCobaltPos()"><i class="fa-solid fa-rotate-left text-[10px]"></i></button>
      </div>
    </div>

    <!-- Pastki Chap: Rul & Spidometr -->
    <div style="position: absolute; bottom: 12px; left: 12px; display: flex; align-items: center; gap: 10px; z-index: 10;">
      <div id="wheel-dial">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #0f172a; border: 2px solid #22c55e; display: flex; align-items: center; justify-content: center;">
          <i class="fa-solid fa-car-side" style="color: #22c55e; font-size: 15px;"></i>
        </div>
      </div>
      <div class="speed-dial">
        <span id="speedNum" style="font-size: 18px; font-weight: 900; color: #fff; font-family: monospace;">0</span>
        <span style="font-size: 7px; color: #94a3b8; font-weight: 700;">KM/SOAT</span>
      </div>
    </div>

    <!-- Pastki O'ng: Uzatma va Pedallar -->
    <div style="position: absolute; bottom: 12px; right: 12px; display: flex; align-items: flex-end; gap: 8px; z-index: 10;">
      <div class="gear-box">
        <div class="gear-item" id="gR" onclick="chooseGear('R')">R</div>
        <div class="gear-item active" id="g1" onclick="chooseGear('1')">1</div>
        <div class="gear-item" id="g2" onclick="chooseGear('2')">2</div>
      </div>
      <div class="pedal-box" id="pedalBrake" style="height: 75px;">
        <div class="pedal-line"></div>
        <div class="pedal-line"></div>
        <span style="font-size: 8px; font-weight: 800; color: #cbd5e1;">STOP</span>
      </div>
      <div class="pedal-box" id="pedalGas" style="height: 90px;">
        <div class="pedal-line"></div>
        <div class="pedal-line"></div>
        <div class="pedal-line"></div>
        <span style="font-size: 9px; font-weight: 900; color: #4ade80;">GAZ</span>
      </div>
    </div>
  </section>

  <!-- ======================================================== -->
  <!-- 2. CODEUSTOZ EKRANI (VS CODE & JONLI BROWSER)            -->
  <!-- ======================================================== -->
  <section id="screen-codeustoz" class="app-screen">
    
    <!-- Yuqori qism: Oq Brauzer Natijasi (Aynan skrinshotdagidek) -->
    <div class="vsc-top-preview">
      <div class="vsc-preview-header">
        <span class="vsc-url-bar">http://127.0.0.1:5500/index.html</span>
        <button onclick="updateLiveSandbox()" style="background: #0284c7; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer;">
          Run
        </button>
      </div>

      <!-- HAQIQIY JONLI ELEMENT CHIQADIGAN JOY -->
      <div id="vsc-render-box">
        <button style="padding: 6px 18px; font-size: 16px; border: 2px solid #555; border-radius: 6px; background: #efefef; cursor: pointer;">salom</button>
      </div>
    </div>

    <!-- Pastki qism: VS Code Tahrirlagichi -->
    <div class="vsc-bottom-editor">
      <div class="vsc-file-tab">
        <i class="fa-brands fa-html5" style="color: #e34c26;"></i>
        <span>index.html</span>
      </div>
      <div class="vsc-text-wrapper">
        <div class="vsc-numbers">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11</div>
        <textarea id="code-text-area" spellcheck="false" oninput="updateLiveSandbox()"><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
</head>
<body>

  <button>salom</button>

</body>
</html></textarea>
      </div>
      <div class="vsc-status">
        <span>main* &bull; HTML</span>
        <span>Live Server: 5500</span>
      </div>
    </div>

  </section>

  <!-- ======================================================== -->
  <!-- PASTKI TAB BAR                                           -->
  <!-- ======================================================== -->
  <nav id="bottom-nav">
    <button class="nav-btn active" id="btnNavAvto" onclick="switchScreen('avtodrom')">
      <i class="fa-solid fa-car"></i>
      <span>Avtodrom 3D</span>
    </button>
    <button class="nav-btn" id="btnNavCode" onclick="switchScreen('codeustoz')">
      <i class="fa-solid fa-code"></i>
      <span>CodeUstoz</span>
    </button>
  </nav>

  <!-- ======================================================== -->
  <!-- JAVASCRIPT LOGIKA                                        -->
  <!-- ======================================================== -->
  <script>
    // Tablarni 100% to'g'ri almashtirish (bir-biriga xalaqit bermasdan)
    function switchScreen(name) {
      const scrAvto = document.getElementById('screen-avtodrom');
      const scrCode = document.getElementById('screen-codeustoz');
      const navAvto = document.getElementById('btnNavAvto');
      const navCode = document.getElementById('btnNavCode');

      if (name === 'avtodrom') {
        scrAvto.classList.add('is-active');
        scrCode.classList.remove('is-active');
        scrCode.style.display = 'none';

        navAvto.classList.add('active');
        navCode.classList.remove('active');

        if (renderer && camera) onResize();
      } else {
        scrAvto.classList.remove('is-active');
        scrCode.classList.add('is-active');
        scrCode.style.display = 'flex';

        navCode.classList.add('active');
        navAvto.classList.remove('active');

        updateLiveSandbox();
      }
    }

    // ========================================================
    // CODEUSTOZ LIVE RUNNER
    // ========================================================
    function updateLiveSandbox() {
      const val = document.getElementById('code-text-area').value;
      const box = document.getElementById('vsc-render-box');

      let parsed = val;
      const match = val.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      if (match && match[1]) {
        parsed = match[1];
      }

      box.innerHTML = parsed;

      // Agar oddiy button bo'lsa rasmdagidek ko'rinish berish
      const btns = box.querySelectorAll('button');
      btns.forEach(b => {
        if (!b.getAttribute('style')) {
          b.style.padding = "6px 18px";
          b.style.fontSize = "16px";
          b.style.border = "2px solid #555";
          b.style.borderRadius = "6px";
          b.style.background = "#efefef";
          b.style.cursor = "pointer";
        }
      });
    }

    // ========================================================
    // THREE.JS 3D AVTODROM ENGINE
    // ========================================================
    let scene, camera, renderer, cobaltModel, cobaltMat;
    let speed = 0;
    let gear = '1';
    let steerAngle = 0;
    let isGas = false;
    let isBrake = false;
    let isFollowCam = true;

    function init3D() {
      const container = document.getElementById('screen-avtodrom');
      const canvas = document.getElementById('three-canvas');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      scene.fog = new THREE.FogExp2(0x87CEEB, 0.01);

      camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 600);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;

      // Yoritish
      const ambLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight.position.set(50, 100, 50);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Asfalt zamini
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(400, 400),
        new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Avtodrom Orolchalari (Bordyur va gazon)
      buildTrack();

      // Chevrolet Cobalt
      buildCobalt();

      loop();
    }

    function buildTrack() {
      function addIsland(x, z, w, d) {
        const g = new THREE.Group();
        const grass = new THREE.Mesh(
          new THREE.BoxGeometry(w, 0.3, d),
          new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.8 })
        );
        grass.position.y = 0.15;
        g.add(grass);

        const curb = new THREE.Mesh(
          new THREE.BoxGeometry(w + 0.5, 0.2, d + 0.5),
          new THREE.MeshStandardMaterial({ color: 0xeab308 })
        );
        curb.position.y = 0.1;
        g.add(curb);

        g.position.set(x, 0, z);
        scene.add(g);
      }

      addIsland(-20, 15, 20, 40);
      addIsland(20, 15, 20, 40);
      addIsland(-20, -40, 20, 40);
      addIsland(20, -40, 20, 40);

      // Zebra
      const zebraMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      for (let i = -7; i <= 7; i += 2) {
        const zLine = new THREE.Mesh(new THREE.PlaneGeometry(1, 5), zebraMat);
        zLine.rotation.x = -Math.PI / 2;
        zLine.position.set(i, 0.05, 5);
        scene.add(zLine);
      }
    }

    function buildCobalt() {
      cobaltModel = new THREE.Group();
      cobaltMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.3 });

      // Kuzov
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.7, 4.4), cobaltMat);
      body.position.y = 0.6;
      body.castShadow = true;
      cobaltModel.add(body);

      // Kabina
      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.9, 0.65, 2.3),
        new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 })
      );
      cabin.position.set(0, 1.25, -0.2);
      cobaltModel.add(cabin);

      // Orqa faralar
      const tl = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.18, 0.1), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
      tl.position.set(0.8, 0.7, -2.21);
      cobaltModel.add(tl);

      const tr = tl.clone();
      tr.position.set(-0.8, 0.7, -2.21);
      cobaltModel.add(tr);

      // G'ildiraklar
      const wGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
      wGeo.rotateZ(Math.PI / 2);
      const wMat = new THREE.MeshStandardMaterial({ color: 0x111827 });

      const w1 = new THREE.Mesh(wGeo, wMat); w1.position.set(1.15, 0.4, 1.4); cobaltModel.add(w1);
      const w2 = new THREE.Mesh(wGeo, wMat); w2.position.set(-1.15, 0.4, 1.4); cobaltModel.add(w2);
      const w3 = new THREE.Mesh(wGeo, wMat); w3.position.set(1.15, 0.4, -1.4); cobaltModel.add(w3);
      const w4 = new THREE.Mesh(wGeo, wMat); w4.position.set(-1.15, 0.4, -1.4); cobaltModel.add(w4);

      cobaltModel.position.set(0, 0, -4);
      scene.add(cobaltModel);
    }

    function setCobaltColor3D(hex) {
      if (cobaltMat) cobaltMat.color.setHex(hex);
      if (hex === 0xffffff) {
        document.getElementById('btnColWhite').style.border = "2px solid #22c55e";
        document.getElementById('btnColBlack').style.border = "1px solid #64748b";
      } else {
        document.getElementById('btnColBlack').style.border = "2px solid #22c55e";
        document.getElementById('btnColWhite').style.border = "1px solid #64748b";
      }
    }

    function chooseGear(g) {
      gear = g;
      ['R', '1', '2'].forEach(i => document.getElementById('g' + i).classList.remove('active'));
      document.getElementById('g' + g).classList.add('active');
    }

    // Rul
    const wheel = document.getElementById('wheel-dial');
    let isSteering = false;

    function moveWheel(e) {
      if (!isSteering) return;
      const rect = wheel.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      const a = Math.atan2(y - cy, x - cx) * (180 / Math.PI);
      steerAngle = Math.max(-90, Math.min(90, a));
      wheel.style.transform = `rotate(${steerAngle}deg)`;
    }

    wheel.addEventListener('touchstart', () => isSteering = true);
    wheel.addEventListener('touchend', () => { isSteering = false; steerAngle = 0; wheel.style.transform = 'rotate(0deg)'; });
    wheel.addEventListener('touchmove', moveWheel);
    wheel.addEventListener('mousedown', () => isSteering = true);
    window.addEventListener('mouseup', () => { isSteering = false; steerAngle = 0; wheel.style.transform = 'rotate(0deg)'; });
    window.addEventListener('mousemove', moveWheel);

    // Pedallar
    const gas = document.getElementById('pedalGas');
    const brake = document.getElementById('pedalBrake');

    gas.addEventListener('touchstart', (e) => { e.preventDefault(); isGas = true; gas.classList.add('is-down'); });
    gas.addEventListener('touchend', () => { isGas = false; gas.classList.remove('is-down'); });
    brake.addEventListener('touchstart', (e) => { e.preventDefault(); isBrake = true; brake.classList.add('is-down'); });
    brake.addEventListener('touchend', () => { isBrake = false; brake.classList.remove('is-down'); });

    gas.addEventListener('mousedown', () => { isGas = true; gas.classList.add('is-down'); });
    gas.addEventListener('mouseup', () => { isGas = false; gas.classList.remove('is-down'); });
    brake.addEventListener('mousedown', () => { isBrake = true; brake.classList.add('is-down'); });
    brake.addEventListener('mouseup', () => { isBrake = false; brake.classList.remove('is-down'); });

    function resetCobaltPos() {
      cobaltModel.position.set(0, 0, -4);
      cobaltModel.rotation.set(0, 0, 0);
      speed = 0;
    }

    function stopCarInstantly() { speed = 0; }
    function toggleCam() { isFollowCam = !isFollowCam; }

    function loop() {
      requestAnimationFrame(loop);

      const maxSpd = (gear === '2') ? 0.6 : (gear === '1') ? 0.35 : -0.25;

      if (isGas) {
        if (gear === 'R') speed = Math.max(maxSpd, speed - 0.01);
        else speed = Math.min(maxSpd, speed + 0.01);
      } else if (isBrake) {
        speed *= 0.82;
      } else {
        speed *= 0.96;
      }

      if (Math.abs(speed) > 0.005) {
        cobaltModel.rotation.y -= (steerAngle / 90) * 0.035 * (speed > 0 ? 1 : -1);
      }

      cobaltModel.translateZ(speed);

      document.getElementById('speedNum').textContent = Math.round(Math.abs(speed) * 85);

      const blip = document.getElementById('miniBlip');
      if (blip) {
        blip.style.left = (43 + cobaltModel.position.x * 0.5) + 'px';
        blip.style.top = (26 - cobaltModel.position.z * 0.4) + 'px';
      }

      if (isFollowCam) {
        const offset = new THREE.Vector3(0, 4, -7);
        offset.applyMatrix4(cobaltModel.matrixWorld);
        camera.position.lerp(offset, 0.12);
        camera.lookAt(cobaltModel.position.x, cobaltModel.position.y + 1, cobaltModel.position.z + 5);
      }

      renderer.render(scene, camera);
    }

    function onResize() {
      const c = document.getElementById('screen-avtodrom');
      if (camera && renderer && c) {
        camera.aspect = c.clientWidth / c.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(c.clientWidth, c.clientHeight);
      }
    }
    window.addEventListener('resize', onResize);

    window.addEventListener('load', () => {
      init3D();
      updateLiveSandbox();
    });
  </script>
</body>
</html>
