<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI AVTO & CodeUstoz</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Three.js 3D Engine for 3D Autodrome -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    .tab-view {
      display: none;
      height: 100vh;
      width: 100vw;
    }
    .tab-view.active {
      display: flex;
      flex-direction: column;
    }

    /* ================================================= */
    /* 3D AVTODROM HUD & CONTROLS (PravaTest EDU STYLING) */
    /* ================================================= */
    #autodrome-container {
      position: relative;
      width: 100%;
      height: calc(100vh - 60px);
      background: #87CEEB;
      overflow: hidden;
    }
    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* HUD Elements */
    .hud-btn {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .hud-btn:active {
      transform: scale(0.94);
      background: rgba(30, 41, 59, 0.9);
    }
    /* Rul (Steering Wheel) */
    #steeringWheel {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #1e293b 40%, #020617 80%, #15803d 95%);
      border: 6px solid #334155;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7), inset 0 0 10px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      transition: transform 0.08s ease-out;
    }
    #steeringWheel::before {
      content: '';
      position: absolute;
      top: 0;
      width: 14px;
      height: 8px;
      background: #22c55e;
      border-radius: 2px;
    }
    /* Pedal Gaz va Tormoz */
    .pedal {
      width: 48px;
      height: 85px;
      border-radius: 10px;
      background: linear-gradient(180deg, #334155 0%, #0f172a 100%);
      border: 2px solid #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 6px 0;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
    }
    .pedal:active, .pedal.pressed {
      background: linear-gradient(180deg, #15803d 0%, #052e16 100%);
      border-color: #22c55e;
      transform: translateY(4px);
    }
    .pedal-bar {
      width: 65%;
      height: 4px;
      background: #94a3b8;
      border-radius: 2px;
    }
    /* Transmissiya (R 1 2) */
    .gear-box {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 3px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 38px;
      text-align: center;
      font-weight: 900;
      font-size: 13px;
    }
    .gear-item {
      padding: 4px 0;
      border-radius: 8px;
      color: #94a3b8;
      cursor: pointer;
    }
    .gear-item.active {
      background: #16a34a;
      color: white;
      box-shadow: 0 0 10px #16a34a;
    }
    /* Spidometr */
    .speedo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: radial-gradient(circle, #0f172a 60%, #1e293b 100%);
      border: 2px solid #475569;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* Davlat Raqami */
    .plate-uz {
      background: #fff;
      color: #0f172a;
      border: 1.5px solid #1e293b;
      font-family: Impact, sans-serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      padding: 1px 6px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
    }

    /* ================================================= */
    /* VS CODE STYLED IDE FOR CODEUSTOZ (RASMDAGIDEK)   */
    /* ================================================= */
    .vscode-container {
      display: flex;
      width: 100%;
      height: calc(100vh - 60px);
      background: #1e1e1e;
      overflow: hidden;
    }
    /* Left Activity Bar */
    .vscode-activity-bar {
      width: 48px;
      background: #333333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 20px;
      color: #858585;
      border-right: 1px solid #252526;
    }
    .vscode-activity-bar i {
      font-size: 18px;
      cursor: pointer;
    }
    .vscode-activity-bar i.active {
      color: #ffffff;
      position: relative;
    }
    .vscode-activity-bar i.active::before {
      content: '';
      position: absolute;
      left: -15px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ffffff;
    }
    /* Editor Split Area (Left Preview, Right Code) */
    .vscode-split-view {
      display: flex;
      flex: 1;
      width: 100%;
      height: 100%;
    }
    /* Live Preview Screen (White side with button salom) */
    .vscode-preview-pane {
      flex: 1;
      background: #ffffff;
      color: #000000;
      border-right: 2px solid #2d2d2d;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      overflow: auto;
      position: relative;
    }
    /* Code Editor Window */
    .vscode-editor-pane {
      flex: 1.2;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .vscode-tab-header {
      background: #252526;
      color: #ffffff;
      font-size: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #007acc;
      width: fit-content;
    }
    .vscode-lines-container {
      display: flex;
      flex: 1;
      overflow: auto;
      padding: 8px 0;
    }
    .vscode-line-numbers {
      width: 38px;
      color: #858585;
      text-align: right;
      padding-right: 12px;
      font-size: 13px;
      line-height: 22px;
      user-select: none;
    }
    .vscode-code-area {
      flex: 1;
      background: transparent;
      color: #d4d4d4;
      font-family: 'Consolas', monospace;
      font-size: 13px;
      line-height: 22px;
      border: none;
      outline: none;
      resize: none;
      white-space: pre;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-between">

  <!-- ========================================================= -->
  <!-- 1. TAB: AVTODROM 3D (XUDDI PRAVATEST EDU RASMIDAGIDEK) -->
  <!-- ========================================================= -->
  <section id="view-avtodrom" class="tab-view active">
    <div id="autodrome-container">
      
      <!-- Three.js 3D Viewport -->
      <canvas id="three-canvas"></canvas>

      <!-- TOP HUD (Imtihon, Menu, Home, MiniMap, Camera) -->
      <div class="absolute top-3 left-3 right-3 flex items-center justify-between pointer-events-none z-10">
        <!-- Left group -->
        <div class="flex items-center gap-2 pointer-events-auto">
          <button onclick="switchTab('hub')" class="hud-btn w-9 h-9">
            <i class="fa-solid fa-bars text-xs"></i>
          </button>
          <button onclick="switchTab('hub')" class="hud-btn w-9 h-9">
            <i class="fa-solid fa-house text-xs"></i>
          </button>
          <div class="hud-btn px-3 py-1.5 flex items-center gap-2 bg-blue-600/80 border-blue-400">
            <i class="fa-solid fa-clipboard-check text-blue-200 text-xs"></i>
            <span class="text-xs font-bold">Imtihon</span>
          </div>

        <!-- Cobalt Rangi va Raqami -->
        <div class="pointer-events-auto flex items-center gap-2">
          <div class="hud-btn p-1 flex items-center gap-1.5 bg-slate-900/80">
            <button onclick="changeCarColor(0xffffff)" id="colWhite" class="w-6 h-6 rounded-lg bg-white border-2 border-emerald-400"></button>
            <button onclick="changeCarColor(0x111827)" id="colBlack" class="w-6 h-6 rounded-lg bg-slate-950 border border-slate-600"></button>
          </div>
          <div class="plate-uz">
            <span class="text-blue-600 font-bold mr-1 text-[9px]">01</span>
            <span>AIAVTOROBOT</span>

        </div>

        <!-- Right group: MiniMap & Camera Buttons -->
        <div class="pointer-events-auto flex flex-col items-end gap-2">
          <!-- MiniMap box -->
          <div class="w-24 h-16 rounded-xl bg-slate-900/80 border border-white/20 p-1 relative overflow-hidden flex items-center justify-center">
            <div class="w-full h-full border border-emerald-500/40 rounded flex items-center justify-center">
              <span class="text-[9px] font-bold text-emerald-400">🗺 Avtodrom</span>
            </div>
            <div class="absolute w-2 h-2 rounded-full bg-blue-400 animate-ping"></div>

          <div class="flex items-center gap-1.5">
            <button onclick="toggleCameraView()" class="hud-btn w-8 h-8">

            </button>
            <button class="hud-btn w-8 h-8 text-rose-400 border-rose-500/30">

              <i class="fa-solid fa-rotate-left text-xs"></i>

        </div>
      </div>

      <!-- Turn signals and Emergency light -->
      <div class="absolute top-20 left-3 flex gap-2 z-10">
        <button id="turnLeft" class="hud-btn w-9 h-8"><i class="fa-solid fa-arrow-left text-xs"></i></button>
        <button id="hazardLight" class="hud-btn w-9 h-8 text-rose-500"><i class="fa-solid fa-triangle-exclamation text-xs"></i></button>
        <button id="turnRight" class="hud-btn w-9 h-8"><i class="fa-solid fa-arrow-right text-xs"></i></button>
      </div>

      <!-- BOTTOM CONTROLS: RUL, SPIDOMETR, TRANSMISSIYA, PEDALLAR -->
      <div class="absolute bottom-4 left-3 right-3 flex items-end justify-between z-10 pointer-events-none">
        <!-- Rul Chap tomonda -->
        <div class="pointer-events-auto flex items-center gap-3">
          <div id="steeringWheel">
            <div class="w-12 h-12 rounded-full bg-slate-900 border border-emerald-500/60 flex items-center justify-center">
              <i class="fa-solid fa-car-side text-emerald-400 text-sm"></i>
            </div>
          </div>

          <!-- Spidometr -->
          <div class="speedo">
            <span id="speedVal" class="text-lg font-black text-white font-mono">0</span>
            <span class="text-[8px] text-slate-400 font-bold uppercase">km/soat</span>
          </div>
        </div>

        <!-- O'ng tomonda: Uzatma (R 1 2) va Pedallar (Tormoz, Gaz) -->
        <div class="pointer-events-auto flex items-end gap-2.5">
          <!-- Uzatmalar -->
          <div class="gear-box">
            <div class="gear-item" onclick="setGear('R')" id="gearR">R</div>
            <div class="gear-item active" onclick="setGear('1')" id="gear1">1</div>
            <div class="gear-item" onclick="setGear('2')" id="gear2">2</div>
          </div>

          <!-- Tormoz Pedali -->
          <div id="pedalBrake" class="pedal cursor-pointer">
            <div class="pedal-bar"></div>
            <div class="pedal-bar"></div>
            <div class="pedal-bar"></div>
            <span class="text-[9px] font-bold text-slate-400">STOP</span>
          </div>

          <!-- Gaz Pedali -->
          <div id="pedalGas" class="pedal cursor-pointer h-24">
            <div class="pedal-bar"></div>
            <div class="pedal-bar"></div>
            <div class="pedal-bar"></div>
            <div class="pedal-bar"></div>
            <span class="text-[9px] font-bold text-emerald-400">GAZ</span>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ========================================================= -->
  <!-- 2. TAB: CODEUSTOZ (XUDDI YUKLANGAN RASMDAGI VS CODE IDE) -->
  <!-- ========================================================= -->
  <section id="view-codeustoz" class="tab-view">
    <div class="vscode-container">
      
      <!-- Left Activity Bar (Files, Search, Source Control, Run) -->
      <div class="vscode-activity-bar">
        <i class="fa-regular fa-file active" title="Explorer"></i>
        <i class="fa-solid fa-magnifying-glass" title="Search"></i>
        <i class="fa-solid fa-code-branch" title="Source Control"></i>
        <i class="fa-solid fa-play text-emerald-400" onclick="runLiveCode()" title="Run Code"></i>
        <i class="fa-solid fa-cubes" title="Extensions"></i>
      </div>

      <!-- Main Split View: Left Browser Result, Right VS Code Editor -->
      <div class="vscode-split-view">
        
        <!-- Chap Tomon: OQ OYNADAGI HAQIQIY NATIJA (RASMDA BO'LGANIDEK) -->
        <div class="vscode-preview-pane">
          <div class="w-full flex items-center justify-between pb-2 mb-3 border-b border-slate-200">
            <span class="text-[11px] font-black text-slate-500 uppercase tracking-wider">

          </div>
          
          <!-- HAQIQIY ELEMENT CHIQADIGAN MARKAZIY JOY -->

          <div class="vscode-tab-header">
            <i class="fa-brands fa-html5 text-orange-500"></i>

  <!-- 3. TAB: ASOSIY HUB (O'tish Menyusi)                      -->

    <div class="text-center">
      <h1 class="text-2xl font-black text-white">AI AVTO & CodeUstoz</h1>

        <span class="flex items-center gap-2">
          <i class="fa-solid fa-car text-xl"></i>
          <span>Cobalt 3D Avtodromi (PravaTest)</span>

  <!-- ========================================================= -->
  <!-- SCRIPTS: 3D THREE.JS AVTODROM & LIVE CODE COMPILER       -->
  <!-- ========================================================= -->
  <script>
    // Tab switching
    function switchTab(tabId) {
      document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
      document.getElementById('view-' + tabId).classList.add('active');

      ['hub', 'avtodrom', 'codeustoz'].forEach(t => {
        const btn = document.getElementById('nav-' + t);
        if (t === tabId) {
          btn.className = "flex flex-col items-center text-emerald-400 font-bold text-xs";
        } else {
          btn.className = "flex flex-col items-center text-slate-400 text-xs";
        }
      });

      if (tabId === 'codeustoz') {
        runLiveCode();
      }
      if (tabId === 'avtodrom') {
        onWindowResize();
      }
    }

    // =========================================================
    // 1. VS CODE & HAQIQIY JONLI KOD NATIJASI (RASMDAGIDEK)
    // =========================================================
    function runLiveCode() {
      const fullCode = document.getElementById('vsCodeEditor').value;
      const preview = document.getElementById('liveBrowserWindow');

      // HTML kodidan body ichidagi narsani ajratib olish yoki to'liq render qilish
      let extractedContent = fullCode;
      const bodyMatch = fullCode.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      if (bodyMatch && bodyMatch[1]) {
        extractedContent = bodyMatch[1];
      }

      // Live Browser oynasiga joylash
      preview.innerHTML = extractedContent;

      // Agar button bo'lsa rasmdagi uslubda chiroyli ko'rinish berish
      const buttons = preview.querySelectorAll('button');
      buttons.forEach(b => {
        if (!b.style.padding) {
          b.className = "px-5 py-2.5 rounded-lg border-2 border-slate-700 bg-slate-100 text-slate-900 font-bold text-base shadow hover:bg-slate-200 active:scale-95 transition cursor-pointer";
        }
      });
    }

    // =========================================================
    // 2. 3D AVTODROM SIMULYATORI (THREE.JS) - PRAVATEST EDU
    // =========================================================
    let scene, camera, renderer, carMesh, carBodyMaterial;
    let speed = 0;
    let gear = '1'; // 'R', '1', '2'
    let steeringAngle = 0;
    let isGasPressed = false;
    let isBrakePressed = false;
    let isThirdPerson = true;

    function init3DAutodrome() {
      const container = document.getElementById('autodrome-container');
      const canvas = document.getElementById('three-canvas');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB); // Sky
      scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

      camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;

      // Chiroqlar
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(50, 100, 50);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Asfalt Avtodrom zamini
      const groundGeo = new THREE.PlaneGeometry(300, 300);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Yo'l chiziqlari va Gazon orolchalari (PravaTest rasmidagidek)
      createAutodromeRoads();

      // CHEVROLET COBALT 3D MODELI (Sedan kuzov)
      createCobaltModel();

      animate();
    }

    function createAutodromeRoads() {
      // Yashil gazon orolchalari
      const islandGeo = new THREE.BoxGeometry(20, 0.2, 40);
      const islandMat = new THREE.MeshStandardMaterial({ color: 0x4ade80 });
      
      const island1 = new THREE.Mesh(islandGeo, islandMat);
      island1.position.set(-25, 0.1, 10);
      scene.add(island1);

      const island2 = new THREE.Mesh(islandGeo, islandMat);
      island2.position.set(25, 0.1, 10);
      scene.add(island2);

      // Oq burilish strelkalari va piyodalar o'tish joyi (Zebra)
      const zebraGeo = new THREE.PlaneGeometry(8, 2);
      const zebraMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      for (let i = -6; i <= 6; i += 2.5) {
        const zebra = new THREE.Mesh(zebraGeo, zebraMat);
        zebra.rotation.x = -Math.PI / 2;
        zebra.position.set(i, 0.05, 5);
        scene.add(zebra);
      }
    }

    function createCobaltModel() {
      carMesh = new THREE.Group();

      // Kuzov (Chevrolet Cobalt formasi)
      carBodyMaterial = new THREE.MeshStandardMaterial({ 
        color: 0xffffff, // Default Oq Cobalt
        roughness: 0.2, 
        metalness: 0.3 
      });

      // Asosiy korpus
      const baseGeo = new THREE.BoxGeometry(2.2, 0.8, 4.4);
      const base = new THREE.Mesh(baseGeo, carBodyMaterial);
      base.position.y = 0.6;
      base.castShadow = true;
      carMesh.add(base);

      // Cobalt Tomi va oynalari
      const cabinGeo = new THREE.BoxGeometry(1.9, 0.7, 2.3);
      const cabinMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.1 });
      const cabin = new THREE.Mesh(cabinGeo, cabinMat);
      cabin.position.set(0, 1.25, -0.2);
      carMesh.add(cabin);

      // G'ildiraklar
      const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
      wheelGeo.rotateZ(Math.PI / 2);

      const wFL = new THREE.Mesh(wheelGeo, wheelMat);
      wFL.position.set(1.15, 0.4, 1.4);
      carMesh.add(wFL);

      const wFR = new THREE.Mesh(wheelGeo, wheelMat);
      wFR.position.set(-1.15, 0.4, 1.4);
      carMesh.add(wFR);

      const wRL = new THREE.Mesh(wheelGeo, wheelMat);
      wRL.position.set(1.15, 0.4, -1.4);
      carMesh.add(wRL);

      const wRR = new THREE.Mesh(wheelGeo, wheelMat);
      wRR.position.set(-1.15, 0.4, -1.4);
      carMesh.add(wRR);

      // Orqa faralar (qizil) va Davlat raqami
      const taillightMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
      const tLightL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), taillightMat);
      tLightL.position.set(0.8, 0.7, -2.2);
      carMesh.add(tLightL);

      const tLightR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), taillightMat);
      tLightR.position.set(-0.8, 0.7, -2.2);
      carMesh.add(tLightR);

      carMesh.position.set(0, 0, -5);
      scene.add(carMesh);
    }

    // Rangini o'zgartirish (Oq yoki Qora)
    function changeCarColor(hex) {
      if (carBodyMaterial) carBodyMaterial.color.setHex(hex);
      if (hex === 0xffffff) {
        document.getElementById('colWhite').className = "w-6 h-6 rounded-lg bg-white border-2 border-emerald-400";
        document.getElementById('colBlack').className = "w-6 h-6 rounded-lg bg-slate-950 border border-slate-600";
      } else {
        document.getElementById('colBlack').className = "w-6 h-6 rounded-lg bg-slate-950 border-2 border-emerald-400";
        document.getElementById('colWhite').className = "w-6 h-6 rounded-lg bg-white border border-slate-300";
      }
    }

    // Uzatmalar
    function setGear(g) {
      gear = g;
      ['R', '1', '2'].forEach(item => {
        document.getElementById('gear' + item).classList.remove('active');
      });
      document.getElementById('gear' + g).classList.add('active');
    }

    // Rulni aylantirish sensorli boshqaruvi
    const wheelEl = document.getElementById('steeringWheel');
    let isSteering = false;

    function handleWheelMove(e) {
      if (!isSteering) return;
      const rect = wheelEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const angle = Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI);
      steeringAngle = Math.max(-90, Math.min(90, angle));
      wheelEl.style.transform = `rotate(${steeringAngle}deg)`;
    }

    wheelEl.addEventListener('touchstart', () => isSteering = true);
    wheelEl.addEventListener('touchend', () => { isSteering = false; steeringAngle = 0; wheelEl.style.transform = 'rotate(0deg)'; });
    wheelEl.addEventListener('touchmove', handleWheelMove);
    wheelEl.addEventListener('mousedown', () => isSteering = true);
    window.addEventListener('mouseup', () => { isSteering = false; steeringAngle = 0; wheelEl.style.transform = 'rotate(0deg)'; });
    window.addEventListener('mousemove', handleWheelMove);

    // Pedallar
    const pedalGas = document.getElementById('pedalGas');
    const pedalBrake = document.getElementById('pedalBrake');

    pedalGas.addEventListener('touchstart', (e) => { e.preventDefault(); isGasPressed = true; pedalGas.classList.add('pressed'); });
    pedalGas.addEventListener('touchend', () => { isGasPressed = false; pedalGas.classList.remove('pressed'); });
    pedalBrake.addEventListener('touchstart', (e) => { e.preventDefault(); isBrakePressed = true; pedalBrake.classList.add('pressed'); });
    pedalBrake.addEventListener('touchend', () => { isBrakePressed = false; pedalBrake.classList.remove('pressed'); });

    pedalGas.addEventListener('mousedown', () => { isGasPressed = true; pedalGas.classList.add('pressed'); });
    pedalGas.addEventListener('mouseup', () => { isGasPressed = false; pedalGas.classList.remove('pressed'); });
    pedalBrake.addEventListener('mousedown', () => { isBrakePressed = true; pedalBrake.classList.add('pressed'); });
    pedalBrake.addEventListener('mouseup', () => { isBrakePressed = false; pedalBrake.classList.remove('pressed'); });

    function resetCar3D() {
      carMesh.position.set(0, 0, -5);
      carMesh.rotation.set(0, 0, 0);
      speed = 0;
    }

    function toggleCameraView() {
      isThirdPerson = !isThirdPerson;
    }

    // 3D Animatsiya sikli
    function animate() {
      requestAnimationFrame(animate);

      // Fizika
      const maxSpd = (gear === '2') ? 0.6 : (gear === '1') ? 0.35 : -0.25;
      if (isGasPressed) {
        if (gear === 'R') speed = Math.max(maxSpd, speed - 0.01);
        else speed = Math.min(maxSpd, speed + 0.01);
      } else if (isBrakePressed) {
        speed *= 0.85;
      } else {
        speed *= 0.96;
      }

      if (Math.abs(speed) > 0.005) {
        carMesh.rotation.y -= (steeringAngle / 90) * 0.03 * (speed > 0 ? 1 : -1);
      }

      carMesh.translateZ(speed);

      // Spidometr yangilash
      document.getElementById('speedVal').textContent = Math.round(Math.abs(speed) * 80);

      // Kamera mashina orqasidan ergashishi (PravaTest rasmidagidek orqa burchak)
      if (isThirdPerson) {
        const offset = new THREE.Vector3(0, 3.8, -6.5);
        offset.applyMatrix4(carMesh.matrixWorld);
        camera.position.lerp(offset, 0.1);
        camera.lookAt(carMesh.position.x, carMesh.position.y + 1, carMesh.position.z + 4);
      } else {
        // Salon ko'rinishi
        camera.position.set(carMesh.position.x - 0.3, carMesh.position.y + 1.2, carMesh.position.z);
        camera.lookAt(carMesh.position.x, carMesh.position.y + 1.2, carMesh.position.z + 5);
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      const container = document.getElementById('autodrome-container');
      if (camera && renderer && container) {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      }
    }
    window.addEventListener('resize', onWindowResize);

    // Initial load
    window.addEventListener('load', () => {
      init3DAutodrome();
      runLiveCode();
    });
  </script>
</body>
</html>
